<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
        }
        /* Header bar */
        header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        /* Bigger Back button style */
        .back-btn {
            background: #ff6f61;
            color: white;
            text-decoration: none;
            padding: 14px 30px;
            border-radius: 30px; /* rounded pill shape */
            font-size: 18px;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .back-btn:hover {
            background: #ff3b2e;
        }
        main {
            padding: 60px 20px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            margin: 40px auto;
            max-width: 600px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        .card h1 {
            color: #2575fc;
            margin-bottom: 20px;
        }
        .card p {
            font-size: 18px;
            color: #555;
        }
    </style>
</head>
<body>
    <!-- Top bar with Back button -->
    <header>
        <button class="back-btn" onclick="history.back()">← Back</button>
    </header>
     <h2>Thank you for your feedback!</h2>
    <a href="{{ url_for('web.feedbacks') }}">
        <button>See All Feedback</button>
    </a>

    <main>
        <div class="card">
            <h1>🎉 Thank You!</h1>
            <p>Your feedback has been submitted successfully.</p>
        </div>
    </main>
</body>
</html>
