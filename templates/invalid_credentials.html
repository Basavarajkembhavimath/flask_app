<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invalid Credentials</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #ff6a6a, #ffcc70); /* warm gradient */
            color: #333;
            text-align: center;
            padding: 60px;
        }
        .card {
            background: #fff;
            border: 2px solid #ff6a6a;
            border-radius: 12px;
            display: inline-block;
            padding: 40px 60px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 2.0em;
            color: #dc3545; /* bold red */
            margin-bottom: 20px;
        }
        p {
            font-size: 1.4em; /* bigger font */
            margin: 20px 0;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background: #007bff;
            color: #fff;
            text-decoration: none;
            font-size: 1.2em;
            border-radius: 6px;
            transition: background 0.3s ease;
        }
        a:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Invalid Credentials</h1>
        <p>Your login attempt failed.</p>
        <p>If you are not registered yet, please register and try logging in again.</p>
        <a href="{{ url_for('web.register') }}">Go to Registration</a>
        <br><br>
        <a href="{{ url_for('web.login') }}">Back to Login</a>
    </div>
</body>
</html>
