<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Colorful Flask Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background: linear-gradient(to right, #2575fc, #6a11cb);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        nav {
            margin-top: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        /* Dropdown styles */
        .dropdown {
            position: absolute;
            top: 20px;
            left: 20px;
        }
        .dropbtn {
            background-color: #6897e3;
            color: white;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }
        .dropbtn:hover {
            background-color: #6a11cb;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 5px;
        }
        .dropdown-content a {
            color: #333;
            padding: 10px 15px;
            text-decoration: none;
            display: block;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }
           .btn-link {
            display: inline-block;
            background: #ff6f61;
            color: white;
            text-decoration: none; /* remove underline */
            padding: 14px 30px;
            border-radius: 30px; /* rounded pill shape */
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .btn-link:hover {
            background: #ff3b2e;
        }

        .show {
            display: block;
        }
        main {
            padding: 40px;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        footer {
            background: #2575fc;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <!-- Dropdown button on top-left -->
        <div class="dropdown">
            <button onclick="toggleDropdown()" class="dropbtn">☰ Menu</button>
            <div id="dropdownMenu" class="dropdown-content">
                <a href="/">Home</a>
                <a href="/projects">Projects</a>
                <a href="/resume">Resume</a>
                <a href="/blog">Blog</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
                <a href="/feedbacks">Feedbacks</a>
            </div>
        </div>

        <h1>Welcome to My Flask App</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/projects">Projects</a>
            <a href="/resume">Resume</a>
            <a href="/blog">Blog</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </nav>
        <!-- Login button on top-right -->
            <!-- Real clickable button -->
    <button class="big-btn" onclick="window.location.href='/login'">Login</button>

    </header>
   
    <main>
        <div class="card">
            <h2>Hello, Flask!</h2>
            <h2>Hello, {{ username }}!</h2>
            <p>This is a colorful HTML template served by Flask.</p>
        </div>
          </div>

        <!-- Image section -->
        <div class="images">
            <img src="{{ url_for('static', filename='image1.jpg') }}" alt="Image 1">
            <img src="{{ url_for('static', filename='image2.jpg') }}" alt="Image 2">
           <!-- <img src="{{ url_for('static', filename='image3.jpg') }}" alt="Image 3"> -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My Flask App</p>
    </footer>

    <script>
        function toggleDropdown() {
            document.getElementById("dropdownMenu").classList.toggle("show");
        }
        // Close dropdown if clicked outside
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                const dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    const openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }
    </script>
</body>
</html>
